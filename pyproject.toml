[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "room-for-doubt"
version = "0.1.0"
description = "Training-dynamics uncertainty research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["room_for_doubt*"]

[project.scripts]
rfd = "room_for_doubt.cli:main"

[tool.setuptools.data-files]
"share/room-for-doubt/configs" = ["configs/*.yaml"]
"share/room-for-doubt/configs/dataset" = ["configs/dataset/*.yaml"]
"share/room-for-doubt/configs/model" = ["configs/model/*.yaml"]
"share/room-for-doubt/configs/optimizer" = ["configs/optimizer/*.yaml"]
"share/room-for-doubt/configs/trainer" = ["configs/trainer/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires downloaded CIFAR data or model artifacts"]
