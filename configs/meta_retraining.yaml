defaults:
  - _self_
  - dataset: cifar10n

seed: 42
split_seed: 20261015
base_seed: 42
run_id: meta_${dataset.name}_${seed}_${now:%Y%m%d_%H%M%S}
output_dir: outputs
target_path: null
cache_path: null
meta_model: conditioned
device: auto
epochs: 25
