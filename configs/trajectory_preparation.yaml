defaults:
  - _self_
  - dataset: cifar10n

seed: 42
run_id: trajectory_prep_${dataset.name}_${seed}_${now:%Y%m%d_%H%M%S}
output_dir: outputs
source_path: null

trajectory:
  start_epoch: 0
  num_epochs: 50
  missing_epoch_policy: drop
  margin_definition: probability_margin

hydra:
  run:
    dir: ${output_dir}/${run_id}
